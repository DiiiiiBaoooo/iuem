<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>We 🩷</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --bg: #FFF4F7;
    --pink-50: #FFE7EF;
    --pink-100: #FFD3E1;
    --pink-200: #FFB8CE;
    --pink-400: #FF7FA6;
    --pink-600: #E85585;
    --pink-700: #C93E6C;
    --plum-900: #4A2E3D;
    --plum-600: #7A5B6C;
    --white: #FFFFFF;
    --gold: #FFD166;
    --shadow-pink: rgba(232, 85, 133, 0.18);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:'Nunito', sans-serif;
    background: radial-gradient(circle at 20% 10%, #FFE9F1 0%, #FFD6E4 45%, #FFC2D6 100%);
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh;
    color:var(--plum-900);
    overflow:hidden;
  }

  h1,h2,h3,.display{font-family:'Baloo 2', cursive;}

  #phone{
    width:100%;
    max-width:420px;
    height:100dvh;
    max-height:900px;
    background:var(--bg);
    position:relative;
    overflow:hidden;
    box-shadow: 0 30px 60px var(--shadow-pink);
    border-radius: 0;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:460px){
    #phone{ border-radius:36px; height:88vh; margin:20px 0; }
  }

  /* ---------- floating hearts bg ---------- */
  .floaty{
    position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0;
  }
  .floaty span{
    position:absolute; bottom:-40px; font-size:18px; opacity:.35;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp{
    to{ transform: translateY(-120vh) rotate(30deg); opacity:0; }
  }

  /* ================= LOCK SCREEN ================= */
  #lock-screen{
    position:relative; z-index:2;
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:36px 28px 28px;
    background: linear-gradient(180deg, var(--pink-50) 0%, var(--bg) 55%);
  }

  .lock-photo-frame{
    width:180px; height:180px; border-radius:26px;
    background:var(--white);
    padding:8px;
    box-shadow: 0 14px 30px var(--shadow-pink);
    transform: rotate(-2deg);
    margin-top: 10px;
  }
  .lock-photo-frame img{
    width:100%; height:100%; object-fit:cover; border-radius:20px; display:block;
  }
  .lock-caption{
    margin-top:14px; font-size:15px; font-weight:700; color:var(--pink-700);
    text-align:center;
  }
  .lock-sub{
    font-size:12.5px; color:var(--plum-600); margin-top:2px; text-align:center;
  }

  .dots{ display:flex; gap:14px; margin:22px 0 18px; }
  .dot{
    width:13px; height:13px; border-radius:50%;
    border:2px solid var(--pink-400); background:transparent;
    transition: all .18s ease;
  }
  .dot.filled{ background:var(--pink-600); border-color:var(--pink-600); transform:scale(1.1); }
  .dots.shake{ animation: shake .38s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-10px); }
    40%{ transform:translateX(9px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(4px); }
  }

  .keypad{
    display:grid; grid-template-columns:repeat(3,64px); gap:16px;
    justify-content:center;
  }
  .key{
    width:64px; height:64px; border-radius:50%;
    background:var(--white); border:none; font-size:22px; font-weight:700;
    color:var(--plum-900); font-family:'Baloo 2', cursive;
    box-shadow: 0 6px 14px rgba(232,85,133,.12);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
    transition: transform .08s ease, background .15s ease;
  }
  .key:active{ transform:scale(.92); background:var(--pink-100); }
  .key.ghost{ background:transparent; box-shadow:none; }
  .key.del{ font-size:18px; color:var(--pink-600); background:transparent; box-shadow:none; }

  .forgot-link{
    margin-top:20px; font-size:13px; color:var(--pink-600); text-decoration:underline;
    background:none; border:none; cursor:pointer; font-family:'Nunito';
  }

  /* scratch overlay */
  #scratch-overlay{
    position:absolute; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center;
    background:rgba(74,46,61,0.35); backdrop-filter: blur(2px);
  }
  #scratch-card{
    width:260px; height:170px; border-radius:22px; position:relative;
    background:var(--white); box-shadow:0 20px 40px rgba(0,0,0,.25);
    overflow:hidden;
  }
  #scratch-hint-text{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:18px; font-weight:700; color:var(--pink-700); font-size:15px;
    font-family:'Baloo 2', cursive;
  }
  #scratch-canvas{ position:absolute; inset:0; cursor:grab; touch-action:none; }
  .scratch-close{
    margin-top:14px; background:var(--white); color:var(--pink-700); border:none;
    padding:8px 18px; border-radius:20px; font-weight:700; cursor:pointer;
  }
  .scratch-wrap{ display:flex; flex-direction:column; align-items:center; }

  /* ================= APP SHELL ================= */
  #app-screen{ display:none; flex-direction:column; height:100%; position:relative; z-index:2; }

  .app-header{
    padding:18px 20px 14px; display:flex; align-items:center; justify-content:space-between;
    background:var(--white); box-shadow:0 4px 14px rgba(232,85,133,.08);
  }
  .app-header h1{ font-size:19px; margin:0; color:var(--pink-700); }
  .app-header .lock-btn{
    background:var(--pink-50); border:none; width:34px; height:34px; border-radius:50%;
    color:var(--pink-600); font-size:15px; cursor:pointer;
  }

  .tab-content{ flex:1; overflow-y:auto; padding:16px 16px 90px; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  /* gallery */
  .gallery-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
  }
  .photo-card{
    position:relative; border-radius:18px; overflow:hidden; aspect-ratio:1/1.05;
    background:var(--pink-50); box-shadow:0 6px 14px rgba(232,85,133,.1);
    cursor:pointer;
  }
  .photo-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-like-badge{
    position:absolute; bottom:6px; right:8px; background:rgba(255,255,255,.88);
    border-radius:14px; padding:3px 8px; font-size:11.5px; font-weight:700; color:var(--pink-600);
    display:flex; align-items:center; gap:3px;
  }
  .empty-state{
    text-align:center; margin-top:60px; color:var(--plum-600);
  }
  .empty-state .big-emoji{ font-size:44px; display:block; margin-bottom:10px; }

  /* letters list */
  .letter-item{
    background:var(--white); border-radius:18px; padding:16px; margin-bottom:12px;
    box-shadow:0 6px 14px rgba(232,85,133,.09); cursor:pointer;
    display:flex; gap:12px; align-items:flex-start;
    border-left: 5px solid var(--pink-300, var(--pink-200));
  }
  .letter-item .envelope-ic{ font-size:26px; }
  .letter-item .lt-title{ font-weight:800; font-size:15px; color:var(--pink-700); margin:0 0 2px; }
  .letter-item .lt-meta{ font-size:12px; color:var(--plum-600); margin:0; }
  .letter-item .lt-preview{ font-size:13px; color:var(--plum-600); margin-top:4px; }

  /* FAB */
  .fab{
    position:absolute; right:20px; bottom:96px; z-index:5;
    width:56px; height:56px; border-radius:50%; border:none;
    background: linear-gradient(145deg, var(--pink-400), var(--pink-600));
    color:white; font-size:26px; box-shadow:0 10px 22px rgba(232,85,133,.4);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .fab:active{ transform:scale(.94); }

  /* bottom tabs */
  .bottom-tabs{
    display:flex; background:var(--white); box-shadow:0 -4px 14px rgba(232,85,133,.08);
    position:absolute; left:0; right:0; bottom:0; z-index:6;
  }
  .tab-btn{
    flex:1; border:none; background:none; padding:12px 0 14px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--plum-600); font-family:'Nunito'; font-weight:700; font-size:11.5px;
  }
  .tab-btn .ic{ font-size:20px; }
  .tab-btn.active{ color:var(--pink-600); }

  /* ============= MODALS ============= */
  .modal-backdrop{
    position:absolute; inset:0; background:rgba(74,46,61,.4); z-index:30;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    width:100%; background:var(--bg); border-radius:26px 26px 0 0;
    padding:22px 20px 26px; max-height:82%; overflow-y:auto;
    animation: slideUp .28s ease;
  }
  @keyframes slideUp{ from{ transform:translateY(40px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-sheet h2{ margin:0 0 4px; font-size:18px; color:var(--pink-700); }
  .modal-close{
    position:absolute; top:14px; right:18px; background:var(--white); border:none;
    width:30px; height:30px; border-radius:50%; color:var(--pink-600); font-weight:700; cursor:pointer;
  }

  .field-label{ font-size:12.5px; font-weight:700; color:var(--plum-600); margin:14px 0 6px; display:block; }
  input[type=text], textarea, select{
    width:100%; border:2px solid var(--pink-100); background:var(--white);
    border-radius:14px; padding:11px 14px; font-family:'Nunito'; font-size:14px;
    color:var(--plum-900); resize:vertical;
  }
  input[type=text]:focus, textarea:focus, select:focus{ outline:none; border-color:var(--pink-400); }
  textarea{ min-height:110px; }

  .primary-btn{
    margin-top:18px; width:100%; padding:13px; border:none; border-radius:16px;
    background:linear-gradient(145deg, var(--pink-400), var(--pink-600)); color:white;
    font-family:'Baloo 2'; font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 10px 20px rgba(232,85,133,.3);
  }
  .primary-btn:disabled{ opacity:.55; cursor:not-allowed; }

  .upload-drop{
    border:2px dashed var(--pink-200); border-radius:16px; text-align:center;
    padding:26px 10px; color:var(--plum-600); font-size:13px; cursor:pointer;
    background:var(--white);
  }
  .upload-preview{ width:100%; border-radius:14px; margin-top:12px; max-height:220px; object-fit:cover; }

  /* photo viewer */
  #photo-viewer{
    position:absolute; inset:0; background:rgba(20,10,15,.92); z-index:40; display:none;
    flex-direction:column; align-items:center; justify-content:center; padding:20px;
  }
  #photo-viewer img{ max-width:100%; max-height:65%; border-radius:16px; object-fit:contain; }
  .viewer-actions{ display:flex; align-items:center; gap:16px; margin-top:16px; color:white; }
  .like-btn{
    background:rgba(255,255,255,.14); border:none; color:white; font-size:22px;
    width:52px; height:52px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease;
  }
  .like-btn.liked{ color:var(--pink-400); }
  .like-btn:active{ transform:scale(1.2); }
  .viewer-caption{ color:#fff; margin-top:12px; font-size:13.5px; text-align:center; opacity:.85; max-width:320px; }
  .viewer-close{
    position:absolute; top:20px; right:20px; background:rgba(255,255,255,.14); border:none;
    color:white; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:15px;
  }

  /* letter reader */
  #letter-reader{
    position:absolute; inset:0; background: linear-gradient(180deg,#FFF0F5,#FFE1EC); z-index:40; display:none;
    flex-direction:column; padding:26px 24px;
  }
  #letter-reader .lr-header{ display:flex; justify-content:space-between; align-items:flex-start; }
  #letter-reader .lr-title{ font-size:19px; color:var(--pink-700); margin:0 0 4px; }
  #letter-reader .lr-meta{ font-size:12px; color:var(--plum-600); }
  #letter-reader-body{
    flex:1; overflow-y:auto; margin-top:22px; font-size:16px; line-height:1.9;
    color:var(--plum-900); font-weight:600;
  }
  .word-reveal{
    display:inline-block; opacity:0; transform:translateY(16px);
    animation: wordUp .5s forwards;
  }
  @keyframes wordUp{ to{ opacity:1; transform:translateY(0); } }

  ::-webkit-scrollbar{ width:0; height:0; }

  #flower-burst-canvas{
    position:absolute; inset:0; z-index:50; display:none; pointer-events:none;
  }
</style>
</head>
<body>

<div id="phone">

  <div class="floaty" id="floaty-bg"></div>
  <canvas id="flower-burst-canvas"></canvas>


  <!-- ============ LOCK SCREEN ============ -->
  <div id="lock-screen">
    <div class="lock-photo-frame">
      <img id="lock-photo" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&q=80" alt="us">
    </div>
    <div class="lock-caption">nhập mật khẩu để vào thế giới của tụi mình 🩷</div>
    <div class="lock-sub">gợi ý: 4 chữ số đặc biệt của hai đứa</div>

    <div class="dots" id="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <div class="key ghost"></div>
      <button class="key" data-k="0">0</button>
      <button class="key del" data-k="del">⌫</button>
    </div>

    <button class="forgot-link" id="forgot-btn">quên mật khẩu rồi 🥺</button>
  </div>

  <!-- scratch to reveal hint -->
  <div id="scratch-overlay">
    <div class="scratch-wrap">
      <div id="scratch-card">
        <div id="scratch-hint-text"></div>
        <canvas id="scratch-canvas"></canvas>
      </div>
      <button class="scratch-close" id="scratch-close-btn">đóng lại</button>
    </div>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="app-screen">
    <div class="app-header">
      <h1>Our Little World 🩷</h1>
      <button class="lock-btn" id="relock-btn" title="khóa lại">🔒</button>
    </div>

    <div class="tab-content">
      <!-- GALLERY -->
      <div class="tab-panel active" id="panel-gallery">
        <div id="gallery-grid" class="gallery-grid"></div>
        <div id="gallery-empty" class="empty-state" style="display:none;">
          <span class="big-emoji">📷</span>
          chưa có tấm ảnh nào cả, thêm tấm đầu tiên đi!
        </div>
      </div>

      <!-- LETTERS -->
      <div class="tab-panel" id="panel-letters">
        <div id="letters-list"></div>
        <div id="letters-empty" class="empty-state" style="display:none;">
          <span class="big-emoji">💌</span>
          chưa có bức thư nào, viết một bức đi nè
        </div>
      </div>
    </div>

    <button class="fab" id="fab-btn">＋</button>

    <div class="bottom-tabs">
      <button class="tab-btn active" data-tab="gallery"><span class="ic">🖼️</span>Ảnh chung</button>
      <button class="tab-btn" data-tab="letters"><span class="ic">💌</span>Thư tay</button>
    </div>
  </div>

  <!-- ============ UPLOAD MODAL ============ -->
  <div class="modal-backdrop" id="upload-modal">
    <div class="modal-sheet" style="position:relative;">
      <button class="modal-close" id="upload-close">✕</button>
      <h2>Đăng ảnh mới</h2>
      <label class="upload-drop" id="upload-drop-zone">
        📷 chạm để chọn ảnh từ máy
        <input type="file" id="file-input" accept="image/*" style="display:none;">
      </label>
      <img id="upload-preview" class="upload-preview" style="display:none;">
      <label class="field-label">chú thích (không bắt buộc)</label>
      <input type="text" id="caption-input" placeholder="khoảnh khắc này là...">
      <button class="primary-btn" id="submit-upload-btn" disabled>Đăng ảnh</button>
    </div>
  </div>

  <!-- ============ LETTER COMPOSER MODAL ============ -->
  <div class="modal-backdrop" id="letter-modal">
    <div class="modal-sheet" style="position:relative;">
      <button class="modal-close" id="letter-close">✕</button>
      <h2>Viết một bức thư</h2>
      <label class="field-label">tiêu đề</label>
      <input type="text" id="letter-title-input" placeholder="gửi người thương của anh/em...">
      <label class="field-label">nội dung</label>
      <textarea id="letter-body-input" placeholder="hôm nay em muốn nói..."></textarea>
      <button class="primary-btn" id="submit-letter-btn">Gửi thư 💌</button>
    </div>
  </div>

  <!-- ============ PHOTO VIEWER ============ -->
  <div id="photo-viewer">
    <button class="viewer-close" id="viewer-close-btn">✕</button>
    <img id="viewer-img" src="">
    <div class="viewer-actions">
      <button class="like-btn" id="viewer-like-btn">🤍</button>
      <span id="viewer-like-count" style="font-weight:700;"></span>
    </div>
    <div class="viewer-caption" id="viewer-caption"></div>
  </div>

  <!-- ============ LETTER READER ============ -->
  <div id="letter-reader">
    <div class="lr-header">
      <div>
        <h2 class="lr-title" id="reader-title"></h2>
        <div class="lr-meta" id="reader-meta"></div>
      </div>
      <button class="viewer-close" id="reader-close-btn" style="position:static; color:var(--pink-600); background:var(--white);">✕</button>
    </div>
    <div id="letter-reader-body"></div>
  </div>

</div>

<script>
/* ============================================================
   CONFIG — chỉnh sửa những dòng dưới đây cho hợp với hai bạn 🩷
   ============================================================ */
const CONFIG = {
  PASSWORD: "8326",
  PASSWORD_HINT: "gợi ý: ngày kỷ niệm đầu tiên của tụi mình 💕 (vd: ngày/tháng ghép lại)",
  LOCK_SCREEN_PHOTO: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&q=80",
  CLOUDINARY_CLOUD_NAME: "duxwt9xpp",
  CLOUDINARY_UPLOAD_PRESET: "lovemylinh",
};

document.getElementById('lock-photo').src = CONFIG.LOCK_SCREEN_PHOTO;
document.getElementById('scratch-hint-text').textContent = CONFIG.PASSWORD_HINT;

const FLOWER_IMAGES = FLOWER_IMG_SOURCES.map(src => {
  const img = new Image();
  img.src = src;
  return img;
});

function playFlowerBurst(){
  const canvas = document.getElementById('flower-burst-canvas');
  const phone = document.getElementById('phone');
  const rect = phone.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');

  const COUNT = 500;
  const particles = [];
  for(let i = 0; i < COUNT; i++){
    particles.push({
      img: FLOWER_IMAGES[Math.floor(Math.random() * FLOWER_IMAGES.length)],
      // rải kín khắp màn hình ngay từ đầu (có cả phần ở phía trên để rơi dần vào khung hình)
      x: Math.random() * canvas.width,
      y: -canvas.height * 0.5 + Math.random() * (canvas.height * 1.35),
      vy: 0.7 + Math.random() * 0.9,
      size: 34 + Math.random() * 34,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 2.4,
      opacity: 1,
      fallGravity: 0.006 + Math.random() * 0.006,
      swaySpeed: 0.5 + Math.random() * 0.7,
      swayAmount: 0.5 + Math.random() * 0.7,
      swayOffset: Math.random() * Math.PI * 2
    });
  }

  const DURATION = 8500;
  const FADE_START = 7000;
  const startTime = performance.now();

  function frame(now){
    const elapsed = now - startTime;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      // rơi thẳng từ trên xuống dưới, tốc độ tăng nhẹ dần + đung đưa ngang như cánh hoa thật
      p.vy += p.fallGravity;
      p.x += Math.sin((elapsed / 1000) * p.swaySpeed + p.swayOffset) * p.swayAmount;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      if(elapsed > FADE_START){
        p.opacity -= 0.012;
      }
      const alpha = Math.max(0, Math.min(1, p.opacity));
      if(alpha <= 0 || !p.img.complete) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.drawImage(p.img, -p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    });
    if(elapsed < DURATION){
      requestAnimationFrame(frame);
    } else {
      canvas.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  requestAnimationFrame(frame);
}

/* ================= LOCK SCREEN LOGIC ================= */
let entered = "";
let wrongCount = 0;
const dotsEl = document.getElementById('dots');
const dotEls = () => Array.from(dotsEl.children);

function updateDots(){
  dotEls().forEach((d,i)=> d.classList.toggle('filled', i < entered.length));
}

function pressDigit(k){
  if(k === 'del'){ entered = entered.slice(0,-1); updateDots(); return; }
  if(entered.length >= 4) return;
  entered += k;
  updateDots();
  if(entered.length === 4){
    setTimeout(checkPassword, 140);
  }
}

function checkPassword(){
  if(entered === CONFIG.PASSWORD){
    unlockApp();
  } else {
    wrongCount++;
    dotsEl.classList.add('shake');
    setTimeout(()=>{
      dotsEl.classList.remove('shake');
      entered = "";
      updateDots();
      if(wrongCount >= 2) document.getElementById('forgot-btn').style.color = 'var(--pink-700)';
    }, 380);
  }
}

document.getElementById('keypad').addEventListener('click', (e)=>{
  const btn = e.target.closest('.key');
  if(!btn || !btn.dataset.k) return;
  pressDigit(btn.dataset.k);
});

document.addEventListener('keydown', (e)=>{
  if(document.getElementById('lock-screen').style.display === 'none') return;
  if(/^[0-9]$/.test(e.key)) pressDigit(e.key);
  if(e.key === 'Backspace') pressDigit('del');
});

function setupScratchCanvas(){
  const canvas = document.getElementById('scratch-canvas');
  const card = document.getElementById('scratch-card');
  const rect = card.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  const ctx = canvas.getContext('2d');
  ctx.globalCompositeOperation = 'source-over';
  const grad = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  grad.addColorStop(0, '#FFB8CE');
  grad.addColorStop(1, '#FF7FA6');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.font = "700 14px 'Baloo 2', cursive";
  ctx.textAlign = 'center';
  ctx.fillText('cào để xem gợi ý 👆', canvas.width/2, canvas.height/2);

  let drawing = false;
  function erase(x,y){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x,y,22,0,Math.PI*2);
    ctx.fill();
  }
  function getPos(evt){
    const r = canvas.getBoundingClientRect();
    const t = evt.touches ? evt.touches[0] : evt;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  canvas.onpointerdown = (e)=>{ drawing = true; const p=getPos(e); erase(p.x,p.y); };
  canvas.onpointermove = (e)=>{ if(drawing){ const p=getPos(e); erase(p.x,p.y); } };
  window.addEventListener('pointerup', ()=> drawing = false);
}

let photos = [];

async function loadGallery(){
  try{
    const res = await fetch('/api/photos');
    photos = await res.json();
  }catch(e){ console.error('Lỗi tải ảnh:', e); photos = []; }
  renderGallery();
}

function renderGallery(){
  const grid = document.getElementById('gallery-grid');
  const empty = document.getElementById('gallery-empty');
  grid.innerHTML = '';
  if(photos.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  photos.slice().reverse().forEach(p=>{
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.innerHTML = `<img src="${p.url}" loading="lazy">
      <div class="photo-like-badge">🩷 ${p.likes || 0}</div>`;
    card.addEventListener('click', ()=> openPhotoViewer(p.id));
    grid.appendChild(card);
  });
}

function openUploadModal(){
  document.getElementById('upload-modal').style.display = 'flex';
}
document.getElementById('upload-close').addEventListener('click', ()=>{
  document.getElementById('upload-modal').style.display = 'none';
  resetUploadForm();
});

let selectedFile = null;
document.getElementById('upload-drop-zone').addEventListener('click', ()=>{
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  selectedFile = file;
  const preview = document.getElementById('upload-preview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  document.getElementById('submit-upload-btn').disabled = false;
});

function resetUploadForm(){
  selectedFile = null;
  document.getElementById('file-input').value = '';
  document.getElementById('upload-preview').style.display = 'none';
  document.getElementById('caption-input').value = '';
  document.getElementById('submit-upload-btn').disabled = true;
  document.getElementById('submit-upload-btn').textContent = 'Đăng ảnh';
}

document.getElementById('submit-upload-btn').addEventListener('click', async ()=>{
  if(!selectedFile) return;
  const btn = document.getElementById('submit-upload-btn');
  btn.disabled = true;
  btn.textContent = 'Đang tải lên...';
  try{
    const url = await uploadToCloudinary(selectedFile);
    const resp = await fetch('/api/photos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url,
        caption: document.getElementById('caption-input').value.trim(),
        uploader: myName
      })
    });
    if(!resp.ok) throw new Error('save photo failed');
    const newPhoto = await resp.json();
    photos.push(newPhoto);
    renderGallery();
    document.getElementById('upload-modal').style.display = 'none';
    resetUploadForm();
  }catch(err){
    console.error(err);
    alert('Upload ảnh thất bại 🥲 kiểm tra lại Cloudinary cloud name / upload preset, hoặc biến môi trường MONGODB_URI trên Vercel nhé.');
    btn.disabled = false;
    btn.textContent = 'Đăng ảnh';
  }
});

async function uploadToCloudinary(file){
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
  const resp = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST',
    body: formData
  });
  if(!resp.ok) throw new Error('Cloudinary upload failed');
  const data = await resp.json();
  return data.secure_url;
}

  document.getElementById('viewer-img').src = p.url;
  document.getElementById('viewer-caption').textContent = p.caption ? `"${p.caption}" — ${p.uploader||''}` : (p.uploader ? `đăng bởi ${p.uploader}` : '');
  document.getElementById('viewer-like-count').textContent = p.likes || 0;
  document.getElementById('viewer-like-btn').classList.toggle('liked', likedLocally.has(id));
  document.getElementById('viewer-like-btn').textContent = likedLocally.has(id) ? '💗' : '🤍';
  document.getElementById('photo-viewer').style.display = 'flex';
}
document.getElementById('viewer-close-btn').addEventListener('click', ()=>{
  document.getElementById('photo-viewer').style.display = 'none';
});

document.getElementById('viewer-like-btn').addEventListener('click', async ()=>{
  const p = photos.find(x=>x.id===currentPhotoId);
  if(!p) return;
  const willLike = !likedLocally.has(p.id);
  if(willLike){ likedLocally.add(p.id); } else { likedLocally.delete(p.id); }
  persistLikedLocally();

  // cập nhật giao diện ngay (optimistic), rồi đồng bộ với server
  p.likes = Math.max(0, (p.likes||0) + (willLike ? 1 : -1));
  document.getElementById('viewer-like-count').textContent = p.likes;
  document.getElementById('viewer-like-btn').classList.toggle('liked', likedLocally.has(p.id));
  document.getElementById('viewer-like-btn').textContent = likedLocally.has(p.id) ? '💗' : '🤍';
  renderGallery();

  try{
    const resp = await fetch('/api/like', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: p.id, like: willLike })
    });
    const data = await resp.json();
    if(typeof data.likes === 'number'){
      p.likes = data.likes;
      document.getElementById('viewer-like-count').textContent = p.likes;
      renderGallery();
    }
  }catch(e){ console.error('Lỗi đồng bộ lượt tym:', e); }
});

/* ================= LETTERS ================= */
let letters = [];

async function loadLetters(){
  try{
    const res = await fetch('/api/letters');
    letters = await res.json();
  }catch(e){ console.error('Lỗi tải thư:', e); letters = []; }
  renderLetters();
}

function renderLetters(){
  const list = document.getElementById('letters-list');
  const empty = document.getElementById('letters-empty');
  list.innerHTML = '';
  if(letters.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  letters.slice().reverse().forEach(l=>{
    const item = document.createElement('div');
    item.className = 'letter-item';
    const dateStr = new Date(l.timestamp).toLocaleDateString('vi-VN');
    item.innerHTML = `
      <div class="envelope-ic">💌</div>
      <div style="flex:1;">
        <p class="lt-title">${escapeHtml(l.title || 'không tiêu đề')}</p>
        <p class="lt-meta">từ ${escapeHtml(l.from)} · ${dateStr}</p>
        <p class="lt-preview">${escapeHtml(l.body.slice(0,50))}${l.body.length>50?'…':''}</p>
      </div>`;
    item.addEventListener('click', ()=> openLetterReader(l.id));
    list.appendChild(item);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function openLetterModal(){
  document.getElementById('letter-modal').style.display = 'flex';
}
document.getElementById('letter-close').addEventListener('click', ()=>{
  document.getElementById('letter-modal').style.display = 'none';
});

document.getElementById('submit-letter-btn').addEventListener('click', async ()=>{
  const title = document.getElementById('letter-title-input').value.trim();
  const body = document.getElementById('letter-body-input').value.trim();
  if(!body){ alert('Viết chút gì đó đã nhé 🥹'); return; }
  const btn = document.getElementById('submit-letter-btn');
  btn.disabled = true; btn.textContent = 'Đang gửi...';
  try{
    const resp = await fetch('/api/letters', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, body, from: myName })
    });
    if(!resp.ok) throw new Error('save letter failed');
    const newLetter = await resp.json();
    letters.push(newLetter);
    renderLetters();
    document.getElementById('letter-modal').style.display = 'none';
    document.getElementById('letter-title-input').value = '';
    document.getElementById('letter-body-input').value = '';
  }catch(err){
    console.error(err);
    alert('Gửi thư thất bại 🥲 kiểm tra lại biến môi trường MONGODB_URI trên Vercel nhé.');
  }
  btn.disabled = false; btn.textContent = 'Gửi thư 💌';
});

/* ---------------- letter reader animation ---------------- */
function openLetterReader(id){
  const l = letters.find(x=>x.id===id);
  if(!l) return;
  document.getElementById('reader-title').textContent = l.title || 'không tiêu đề';
  document.getElementById('reader-meta').textContent = `từ ${l.from} · ${new Date(l.timestamp).toLocaleString('vi-VN')}`;
  const bodyEl = document.getElementById('letter-reader-body');
  bodyEl.innerHTML = '';
  const words = l.body.split(/\s+/).filter(Boolean);
  words.forEach((w, i)=>{
    const span = document.createElement('span');
    span.className = 'word-reveal';
    span.textContent = w + ' ';
    span.style.animationDelay = (i * 0.14) + 's';
    bodyEl.appendChild(span);
  });
  document.getElementById('letter-reader').style.display = 'flex';
}
document.getElementById('reader-close-btn').addEventListener('click', ()=>{
  document.getElementById('letter-reader').style.display = 'none';
});

/* init dots on load */
updateDots();
</script>
